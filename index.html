<style>

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;

  .page {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
    text-align: center;
  }
  .mark {
    width: 100%;
    display: block;
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    box-shadow: 0 24px 60px -24px rgba(35, 41, 31, 0.3);
  }
  h1 {
    margin: 0;
    font-family: 'Fraunces', Georgia, serif;
    font-size: clamp(26px, 4vw, 36px);
    font-weight: 700;
    line-height: 1.25;
  }
  p {
    margin: 0;
    font-size: 16px;
    line-height: 1.6;
    color: #6B685F;
    max-width: 440px;
  }
  .cta {
    display: inline-flex;
    align-items: center;
    padding: 14px 30px;
    background: var(--accent);
    color: #FFFFFF;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
  }
  .cta:hover { opacity: 0.88; }
  footer {
    font-size: 12px;
    color: #8A8677;
  }

  /* ---- brand-mark animation, ported from the wireframe ---- */
  .marsh-back, .marsh-mid, .marsh-front {
    transform-box: fill-box;
    transform-origin: 50% 100%;
  }
  .marsh-back  { animation: driftBack 8s ease-in-out infinite; }
  .marsh-mid   { animation: driftMid 8s ease-in-out infinite; }
  .marsh-front { animation: driftFront 8s ease-in-out infinite; }
  @keyframes driftBack  { 0%,100% { transform: translateX(-6px); } 50% { transform: translateX(6px); } }
  @keyframes driftMid   { 0%,100% { transform: translateX(-9px); } 50% { transform: translateX(9px); } }
  @keyframes driftFront { 0%,100% { transform: translateX(-12px); } 50% { transform: translateX(12px); } }
  .marsh-back path  { stroke: #9DB49A; }
  .marsh-mid path   { stroke: #7E9A81; }
  .marsh-front path { stroke: #5C7A66; }

  .street {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    opacity: 0;
    transform: translateY(24px);
    animation: revealStreet 1.1s cubic-bezier(.22,.7,.32,1) 0.4s 1 forwards;
  }
  @keyframes revealStreet { 0% { opacity: 0; transform: translateY(24px); } 100% { opacity: 1; transform: translateY(0); } }

  .wordmark {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    opacity: 0;
    transform: scale(0.9);
    animation: revealMark 0.9s cubic-bezier(.22,.7,.32,1) 1.3s 1 forwards;
  }
  @keyframes revealMark { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }

  .tagline { opacity: 0; animation: revealTagline 0.7s ease-out 2.0s 1 forwards; }
  @keyframes revealTagline { 0% { opacity: 0; } 100% { opacity: 1; } }

  .cloud { opacity: 0; animation: cloudFade 1.2s ease-out 3.0s 1 forwards, cloudDrift 16s ease-in-out infinite; }
  @keyframes cloudFade { 0% { opacity: 0; } 100% { opacity: 0.95; } }
  @keyframes cloudDrift { 0%,100% { transform: translateX(-10px); } 50% { transform: translateX(10px); } }

  .sun { opacity: 0; animation: sunFade 1.6s ease-out 2.6s 1 forwards; }
  @keyframes sunFade { 0% { opacity: 0; } 100% { opacity: 1; } }

  .bird { opacity: 0; animation: birdFade 1.3s ease-out 2.8s 1 forwards, birdBob 6s ease-in-out infinite; }
  @keyframes birdFade { 0% { opacity: 0; } 100% { opacity: 1; } }
  @keyframes birdBob { 0%,100% { transform: translateY(-3px); } 50% { transform: translateY(3px); } }
</style>
</head>

<script>
  function makeBlades(ranges, perRange, baseY, minH, maxH) {
    var blades = [];
    var idx = 0;
    for (var r = 0; r < ranges.length; r++) {
      var rs = ranges[r][0], re = ranges[r][1];
      for (var i = 0; i < perRange; i++) {
        var t = perRange === 1 ? 0.5 : i / (perRange - 1);
        var x = rs + t * (re - rs);
        var h = minH + ((Math.sin(idx * 7.3) + 1) / 2) * (maxH - minH);
        var curve = 6 + (idx % 3) * 4;
        var d = 'M ' + x + ',' + baseY + ' Q ' + (x + curve) + ',' + (baseY - h * 0.6) + ' ' + (x + curve * 0.5) + ',' + (baseY - h);
        blades.push(d);
        idx++;
      }
    }
    return blades;
  }

  function renderBlades(groupId, ranges, perRange, baseY, minH, maxH, strokeWidth) {
    var g = document.getElementById(groupId);
    var ds = makeBlades(ranges, perRange, baseY, minH, maxH);
    g.innerHTML = ds.map(function (d) {
      return '<path d="' + d + '" stroke-width="' + strokeWidth + '" fill="none" stroke-linecap="round"></path>';
    }).join('');
  }

  var EDGES = [[4, 54], [846, 896]];
  renderBlades('marsh-back-g', EDGES, 5, 505, 22, 38, 5);
  renderBlades('marsh-mid-g', EDGES, 5, 530, 32, 54, 6);
  renderBlades('marsh-front-g', EDGES, 6, 555, 48, 88, 7);

  var ANIM = [
    ['street-g', 'none', 'revealStreet'],
    ['wordmark-text', 'none', 'revealMark'],
    ['tagline-text', 'none', 'revealTagline'],
    ['sun-g', 'none', 'sunFade'],
    ['cloud1-g', 'none, cloudDrift', 'cloudFade, cloudDrift'],
    ['cloud2-g', 'none, cloudDrift', 'cloudFade, cloudDrift'],
    ['bird-g', 'none, birdBob', 'birdFade, birdBob']
  ];
  function replayMark() {
    ANIM.forEach(function (a) {
      var el = document.getElementById(a[0]);
      if (el) el.style.animationName = a[1];
    });
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        ANIM.forEach(function (a) {
          var el = document.getElementById(a[0]);
          if (el) el.style.animationName = a[2];
        });
      });
    });
  }
</script>
