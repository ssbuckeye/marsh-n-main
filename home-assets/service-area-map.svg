<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 215">
  <rect x="0" y="0" width="490" height="215" rx="16" fill="#FAF8F3"/>

  <!-- Savannah, GA -->
  <path d="M 14,80
           C 10,55 35,35 65,38
           C 90,40 104,54 101,80
           C 99,106 109,126 90,144
           C 70,160 40,158 22,139
           C 8,122 16,100 14,80 Z"
        fill="#F1EDE4" stroke="#5C7A66" stroke-width="2.5"/>

  <!-- mainland (Beaufort / Bluffton) -->
  <path d="M 112,58
           C 108,30 148,12 198,14
           C 255,16 304,8 330,30
           C 352,49 340,70 346,88
           C 352,106 338,120 312,118
           C 288,116 278,136 248,149
           C 210,160 148,154 124,128
           C 104,108 114,83 112,58 Z"
        fill="#F1EDE4" stroke="#5C7A66" stroke-width="2.5"/>

  <!-- Hilton Head Island -->
  <path d="M 348,148
           C 342,126 374,109 406,113
           C 438,116 464,122 476,141
           C 488,161 476,185 450,198
           C 424,211 390,207 366,193
           C 351,183 351,166 348,148 Z"
        fill="#F1EDE4" stroke="#5C7A66" stroke-width="2.5"/>

  <!-- waterway accent blades (brand mark motif) -->
  <g stroke="#5C7A66" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5">
    <path d="M 18,196 Q 22,183 17,171"/>
    <path d="M 29,199 Q 34,185 31,170"/>
    <path d="M 40,196 Q 43,183 40,172"/>
  </g>

  <!-- route line connecting the four towns -->
  <path d="M 55,95 Q 120,80 185,68 Q 230,86 262,110 Q 310,132 390,152"
        fill="none" stroke="#5C7A66" stroke-width="2" stroke-dasharray="1,7" stroke-linecap="round" opacity="0.6"/>

  <!-- Savannah pin -->
  <circle cx="55" cy="95" r="9" fill="none" stroke="#5C7A66" stroke-width="1.6" opacity="0.55"/>
  <circle cx="55" cy="95" r="5" fill="#5C7A66"/>
  <text x="62" y="118" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="15" fill="#23291F">Savannah</text>

  <!-- Beaufort pin -->
  <circle cx="185" cy="68" r="9" fill="none" stroke="#5C7A66" stroke-width="1.6" opacity="0.55"/>
  <circle cx="185" cy="68" r="5" fill="#5C7A66"/>
  <text x="199" y="64" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="15" fill="#23291F">Beaufort</text>

  <!-- Bluffton pin -->
  <circle cx="262" cy="110" r="9" fill="none" stroke="#5C7A66" stroke-width="1.6" opacity="0.55"/>
  <circle cx="262" cy="110" r="5" fill="#5C7A66"/>
  <text x="276" y="106" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="15" fill="#23291F">Bluffton</text>

  <!-- Hilton Head Island pin -->
  <circle cx="390" cy="152" r="9" fill="none" stroke="#5C7A66" stroke-width="1.6" opacity="0.55"/>
  <circle cx="390" cy="152" r="5" fill="#5C7A66"/>
  <text x="481" y="177" font-family="Fraunces, Georgia, serif" font-weight="600" font-size="14" fill="#23291F" text-anchor="end">Hilton Head Island</text>
</svg>
